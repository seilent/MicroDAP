name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      BUILDER_REPO: ghcr.io/seilent/microdap-builder
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Keys
        id: keys
        run: |
          echo "builder=$(cat build/Containerfile build/deps.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "microset=$(sed -n 's/^MICROSET_REF=//p' build/microset.env)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: seilent/MicroSET
          ref: ${{ steps.keys.outputs.microset }}
          path: microset

      - name: Builder image
        env:
          KEY: ${{ steps.keys.outputs.builder }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image="${BUILDER_REPO}:${KEY}"
          printf '%s' "${TOKEN}" | podman login ghcr.io -u "${ACTOR}" --password-stdin
          if podman pull "${image}"; then
            podman tag "${image}" localhost/microdap-builder
          else
            podman build -t localhost/microdap-builder -f build/Containerfile .
            if [[ "${PUBLISH}" == true ]]; then
              podman tag localhost/microdap-builder "${image}"
              podman push "${image}"
            fi
          fi

      - uses: actions/cache@v4
        with:
          path: build/cache
          key: cache-${{ steps.keys.outputs.builder }}-${{ github.run_id }}
          restore-keys: |
            cache-${{ steps.keys.outputs.builder }}-

      - name: Build and test
        run: podman run --rm -v "$PWD":/work:Z -e MICROSET_SRC=/work/microset localhost/microdap-builder build/ci.sh
