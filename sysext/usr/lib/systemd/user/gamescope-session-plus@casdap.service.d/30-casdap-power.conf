[Unit]
Wants=casdap-powerd.service

[Service]
ExecStopPost=/usr/libexec/casdap/casdap-power screen-on
ExecStopPost=systemctl start casdap-priv@hp-gain-normal.service
ExecStopPost=systemctl start casdap-priv@hp-amp-lohifi.service
ExecStopPost=systemctl start casdap-priv@spk-gain-102.service
ExecStopPost=systemctl start casdap-priv@rgb-restore.service
